name: Database
on:
    push:
    pull_request:
        branches: [master]

jobs:
  tests:
    name: ubuntu-tests-Python-${{matrix.python-version}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    services:
      mysql:
        image: mysql:5.7
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password

    env:
      DATABASE_URL: mysql://test_user:test_password@mysql/test_db

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: |
          /var/cache/apt/archives
          /var/lib/apt/lists
        key: ${{ runner.os }}-apt-cache-${{ hashFiles('.github/workflows/database.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-cache-

    - name: C++ dependencies
      run: | 
        sudo apt-get update
        sudo apt-get install -y libboost-graph-dev
        sudo apt-get install -y graphviz graphviz-dev

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install 'pyquafu==0.4.2'
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

    - name: Install qsteed
      run: pip install -e . -v

    - name: Wait for MySQL to be ready
      run: |
        while ! mysqladmin ping -h "mysql" --silent; do
          echo "Waiting for database connection..."
          sleep 10
        done

    - name: Set up MySQL database
      run: |
        mysql -h mysql -u root -proot_password -e "CREATE DATABASE IF NOT EXISTS test_db;"
        mysql -h mysql -u root -proot_password -e "GRANT ALL PRIVILEGES ON test_db.* TO 'test_user'@'%' IDENTIFIED BY 'test_password';"
        mysql -h mysql -u root -proot_password -e "GRANT ALL PRIVILEGES ON test_db.* TO 'test_user'@'%';"
        mysql -h mysql -u root -proot_password -e "FLUSH PRIVILEGES;"

    - name: First build database
      run: |
        python -c "from qsteed.first_build_db import first_build_db; first_build_db()"

    - name: Wait for 5 seconds
      run: |
        bash -c "sleep 5"

    - name: Test with pytest
      run: |
        pip install pytest
        pytest tests/test_database.py
        pytest tests/test_resourceDB_api.py
        pytest tests/test_database_query.py
        pytest tests/test_compiler.py
        pytest tests/test_compiler_api.py
        
        pytest tests/test_dag.py
        pytest tests/test_transpiler.py
        pytest tests/test_transpiler_parallelcircuits.py
        pytest tests/test_transpiler_parametercircuit.py
        pytest tests/test_transpiler_visualization.py
        pytest tests/test_unitary_decompose.py
